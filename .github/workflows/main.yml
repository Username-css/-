name: Win

on:
  workflow_dispatch:
    inputs:
      raw_command:
        description: 'Paste full command from Google here'
        required: true
        type: string
      pin:
        description: 'Remote PIN (min 6 digits)'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: windows-latest
    steps:
      - name: Install and Register CRD
        shell: powershell
        run: |
          $url = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
          
          Write-Host "Downloading Chrome Remote Desktop..."
          curl.exe -sL $url -o crd.msi

          if (Test-Path "crd.msi") {
            Write-Host "Installing CRD via MSI..."
            Start-Process msiexec.exe -ArgumentList '/i crd.msi /qn' -Wait
            Remove-Item crd.msi
          } else {
            Write-Host "Fallback to Chocolatey..."
            choco install chrome-remote-desktop -y
          }

          $crdExe = Get-ChildItem "C:\Program Files (x86)\Google\Chrome Remote Desktop" -Recurse -Filter "remotedesktop_host.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $crdExe) {
            $crdExe = Get-ChildItem "C:\Program Files (x86)\Google\Chrome Remote Desktop" -Recurse -Filter "remoting_start_host.exe" | Select-Object -First 1 -ExpandProperty FullName
          }

          $raw = '${{ inputs.raw_command }}'
          $code = ""
          if ($raw -match '--(?:code|authorizing-code)=["'']?([^"'']\S+)["'']?') {
            $code = $matches[1]
          } else {
            $code = $raw.Trim()
          }

          $pin = "${{ inputs.pin }}"

          Write-Host "Registering Host to Google..."
          & $crdExe --inject-user-build --authorizing-code="$code" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name=$env:COMPUTERNAME --pin="$pin"

      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
