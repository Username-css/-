name: Win

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Kode OAuth dari Google (hanya teks 4/0A...)'
        required: true
        type: string
      pin:
        description: 'PIN Remote (minimal 6 angka)'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: windows-latest
    steps:
      - name: Enable Remote Desktop & Display
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue

      - name: Install Chrome Remote Desktop
        shell: powershell
        run: |
          curl.exe -sL "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -o crd.msi
          Start-Process msiexec.exe -ArgumentList '/i crd.msi /qn' -Wait
          Remove-Item crd.msi

      - name: Register CRD Host
        shell: powershell
        run: |
          $crdDir = Get-ChildItem "C:\Program Files (x86)\Google\Chrome Remote Desktop" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $crdExe = Join-Path $crdDir.FullName "remoting_start_host.exe"

          $code = "${{ inputs.auth_code }}".Trim()
          $pin = "${{ inputs.pin }}".Trim()

          Write-Host "Registering using: $crdExe"
          & "$crdExe" --code="$code" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name=$env:COMPUTERNAME --pin="$pin" --suppress-dialogs-for-testing

      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
