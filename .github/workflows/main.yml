name: Win

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Konfigurasi RDP & Jalankan Pinggy
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $password = "P@ssword123"
          net user runneradmin $password

          $token = "${{ secrets.PINGGY_TOKEN }}"
          
          Start-Process cmd.exe -ArgumentList "/c ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:3389 ${token}@free.pinggy.io > pinggy.log 2>&1" -NoNewWindow
          
          Start-Sleep -Seconds 10

          $rdpUrl = ""
          for ($i = 0; $i -lt 15; $i++) {
            if (Test-Path "pinggy.log") {
              $lines = Get-Content "pinggy.log" -ErrorAction SilentlyContinue
              foreach ($line in $lines) {
                if ($line -match '([a-zA-Z0-9\.-]+\.pinggy\.[a-zA-Z]+:\d+)') {
                  $rdpUrl = $matches[1]
                  break
                }
                if ($line -match 'tcp://([a-zA-Z0-9\.-]+:\d+)') {
                  $rdpUrl = $matches[1]
                  break
                }
              }
            }
            if ($rdpUrl) { break }
            Start-Sleep -Seconds 2
          }

          Write-Host "=========================================================="
          Write-Host "ALAMAT RDP   : $rdpUrl"
          Write-Host "USERNAME     : runneradmin"
          Write-Host "KATA SANDI   : $password"
          Write-Host "=========================================================="

          if (-not $rdpUrl) {
            Write-Host "--- LOG DEBUG PINGGY ---"
            Get-Content "pinggy.log" -ErrorAction SilentlyContinue
          }

      - name: Jaga Sesi
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
