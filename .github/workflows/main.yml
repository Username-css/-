name: Windows RDP Pinggy

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Konfigurasi RDP & Jalankan Pinggy
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $password = "P@ssword123"
          net user runneradmin $password

          $token = "${{ secrets.PINGGY_TOKEN }}"
          
          # Jalankan SSH Pinggy di background job tanpa alokasi TTY (-t)
          Start-Job -ScriptBlock {
            param($t)
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:3389 "${t}@free.pinggy.io" > pinggy.log 2>&1
          } -ArgumentList $token

          $rdpUrl = ""
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "pinggy.log") {
              $rawContent = Get-Content "pinggy.log" -Raw -ErrorAction SilentlyContinue
              
              # Regex diperluas untuk menangkap format URL TCP Pinggy
              if ($rawContent -match '([a-zA-Z0-9\.-]+\.(?:pinggy\.link|pinggy\.io):\d+)') {
                $rdpUrl = $matches[1]
                break
              }
            }
          }

          Write-Host "=========================================================="
          Write-Host "ALAMAT RDP   : $rdpUrl"
          Write-Host "USERNAME     : runneradmin"
          Write-Host "KATA SANDI   : $password"
          Write-Host "=========================================================="

          if (-not $rdpUrl) {
            Write-Host "--- LOG DEBUG PINGGY ---"
            Get-Content "pinggy.log" -ErrorAction SilentlyContinue
          }

      - name: Jaga Sesi
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
