name: Win

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Konfigurasi RDP & Jalankan Pinggy
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $password = "P@ssword123"
          net user runneradmin $password

          $token = "${{ secrets.PINGGY_TOKEN }}"
          
          Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 ${token}@a.pinggy.io" -RedirectStandardOutput "$PWD\pinggy.log" -RedirectStandardError "$PWD\pinggy_err.log" -NoNewWindow

          $rdpUrl = ""
          for ($i = 0; $i -lt 15; $i++) {
            if (Test-Path "$PWD\pinggy.log") {
              $logContent = Get-Content "$PWD\pinggy.log" -Raw -ErrorAction SilentlyContinue
              if ($logContent -match 'tcp://([a-zA-Z0-9.-]+:\d+)') {
                $rdpUrl = $matches[1]
                break
              }
            }
            Start-Sleep -Seconds 2
          }

          Write-Host "=========================================================="
          Write-Host "ALAMAT RDP   : $rdpUrl"
          Write-Host "USERNAME     : runneradmin"
          Write-Host "KATA SANDI   : $password"
          Write-Host "=========================================================="

      - name: Jaga Sesi
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
