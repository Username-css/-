Name: Windows

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools & Dependencies
        run: |
          choco install tightvnc -y
          git clone https://github.com/novnc/noVNC.git C:\noVNC
          python -m pip install --upgrade pip
          python -m pip install websockify
          npm install localtunnel

      - name: Configure & Start TightVNC
        shell: powershell
        run: |
          net stop tvnserver /y
          
          Remove-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "Password" -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "PasswordHex" -ErrorAction SilentlyContinue
          
          New-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "UseVncAuthentication" -Value 0 -PropertyType DWORD -Force
          New-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "AuthRequired" -Value 0 -PropertyType DWORD -Force
          New-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "ExtraWithControl" -Value 0 -PropertyType DWORD -Force
          New-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "MatchingHosts" -Value "127.0.0.1:N" -PropertyType String -Force
          New-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "AllowLoopback" -Value 1 -PropertyType DWORD -Force
          
          net start tvnserver
          
          Write-Host "Waiting for TightVNC Port 5900..."
          $portReady = $false
          for ($i = 0; $i -lt 15; $i++) {
            if (Test-NetConnection -ComputerName "127.0.0.1" -Port 5900 -InformationLevel Quiet) {
              $portReady = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $portReady) { throw "TightVNC failed to listen on port 5900" }

      - name: Start Services, Tunnel & Keep Alive
        shell: powershell
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org")
          
          Start-Process python -ArgumentList "-m websockify --web C:\noVNC --heartbeat=30 6080 127.0.0.1:5900" -NoNewWindow
          Start-Sleep -Seconds 3
          
          $jsCode = @"
          const localtunnel = require('localtunnel');
          (async () => {
            try {
              const tunnel = await localtunnel({ port: 6080 });
              console.log('TUNNEL_URL:' + tunnel.url);
              tunnel.on('close', () => {
                console.log('Tunnel closed');
              });
            } catch (err) {
              console.error(err);
            }
          })();
          "@
          Set-Content -Path "$PWD\start_tunnel.js" -Value $jsCode
          
          $logFile = "$PWD\lt.log"
          Start-Process node -ArgumentList "$PWD\start_tunnel.js" -RedirectStandardOutput $logFile -RedirectStandardError "$PWD\lt_err.log" -NoNewWindow
          
          $urlFound = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $logFile) {
              $log = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
              if ($log -and $log -match "TUNNEL_URL:(https://[a-zA-Z0-9-]+\.loca\.lt)") {
                $vncUrl = $matches[1]
                Write-Host "=========================================================="
                Write-Host "VNC ACCESS URL : $vncUrl/vnc.html"
                Write-Host "TUNNEL PASSWORD: $ip"
                Write-Host "=========================================================="
                Write-Host "Note: If prompted for 'Endpoint IP / Password' on the page,"
                Write-Host "enter the IP address shown above: $ip"
                Write-Host "=========================================================="
                $urlFound = $true
                break
              }
            }
            Start-Sleep -Seconds 1
          }

          if (-not $urlFound) {
            Write-Host "Failed to get Localtunnel URL. Log contents:"
            Get-Content $logFile -ErrorAction SilentlyContinue
            Get-Content "$PWD\lt_err.log" -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 21600
