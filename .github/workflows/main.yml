name: Windows RDP Pinggy

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Konfigurasi RDP & Jalankan Pinggy
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $password = "P@ssword123"
          net user runneradmin $password

          # 1. Download Pinggy CLI versi Windows
          Invoke-WebRequest -Uri "https://pinggy.io/cli/pinggy_windows_amd64.exe" -OutFile "pinggy.exe"

          $token = "${{ secrets.PINGGY_TOKEN }}"
          
          # 2. Jalankan Pinggy CLI di background
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\pinggy.exe"
          $psi.Arguments = "tcp --target localhost:3389 --token $token"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true

          $process = [System.Diagnostics.Process]::Start($psi)

          $rdpUrl = ""
          # 3. Baca output stream secara real-time
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            
            # Cek output stdout
            if (-not $process.StandardOutput.EndOfStream) {
              $line = $process.StandardOutput.ReadLine()
              if ($line -match '([a-zA-Z0-9\.-]+\.(?:pinggy\.link|pinggy\.io|pinggy\.online):\d+)') {
                $rdpUrl = $matches[1]
                break
              }
            }
          }

          Write-Host "=========================================================="
          Write-Host "ALAMAT RDP   : $rdpUrl"
          Write-Host "USERNAME     : runneradmin"
          Write-Host "KATA SANDI   : $password"
          Write-Host "=========================================================="

          if (-not $rdpUrl) {
            Write-Host "--- LOG DEBUG (Membaca sisa output) ---"
            $output = $process.StandardOutput.ReadToEnd()
            $errorOutput = $process.StandardError.ReadToEnd()
            Write-Host "STDOUT: $output"
            Write-Host "STDERR: $errorOutput"
          }

      - name: Jaga Sesi
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
