name: Win

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RustDesk
        run: |
          choco install rustdesk -y

      - name: Konfigurasi RustDesk
        shell: powershell
        run: |
          Set-Service -Name "rustdesk" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "rustdesk" -ErrorAction SilentlyContinue

          $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 10 | ForEach-Object {[char]$_})
          
          & "C:\Program Files\RustDesk\rustdesk.exe" --password $password
          & "C:\Program Files\RustDesk\rustdesk.exe" --option password $password
          
          Start-Sleep -Seconds 10

          $rustdeskId = ""
          
          $systemConfigPath = "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk2.toml"
          $userConfigPath   = "$env:APPDATA\RustDesk\config\RustDesk2.toml"
          
          for ($i = 0; $i -lt 15; $i++) {
            if (Test-Path $systemConfigPath) {
              $content = Get-Content $systemConfigPath -Raw -ErrorAction SilentlyContinue
              if ($content -match 'id\s*=\s*"(\d+)"') {
                $rustdeskId = $matches[1]
                break
              }
            }
            
            if (-not $rustdeskId -and (Test-Path $userConfigPath)) {
              $content = Get-Content $userConfigPath -Raw -ErrorAction SilentlyContinue
              if ($content -match 'id\s*=\s*"(\d+)"') {
                $rustdeskId = $matches[1]
                break
              }
            }

            if (-not $rustdeskId) {
              $idOutput = cmd /c '"C:\Program Files\RustDesk\rustdesk.exe" --get-id' 2>&1
              if ($idOutput -match '\d{9,10}') {
                $rustdeskId = $matches[0]
                break
              }
            }
            
            Start-Sleep -Seconds 2
          }

          Write-Host "=========================================================="
          Write-Host "ID RUSTDESK      : $rustdeskId"
          Write-Host "KATA SANDI       : $password"
          Write-Host "=========================================================="

      - name: Jaga Sesi
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
