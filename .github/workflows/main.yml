name: Windows AnyDesk

on: workflow_dispatch

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AnyDesk
        run: |
          choco install anydesk -y

      - name: Configure AnyDesk & Set Password
        shell: powershell
        run: |
          # Set password untuk akses unattended (ganti 'P@ssword123' sesuai keinginan)
          $password = "P@ssword123"
          echo $password | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          
          # Tunggu service AnyDesk siap
          Start-Sleep -Seconds 5
          
          # Ambil AnyDesk ID
          $anydeskId = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          
          Write-Host "=========================================================="
          Write-Host "ANYDESK ID       : $anydeskId"
          Write-Host "ANYDESK PASSWORD : $password"
          Write-Host "=========================================================="

      - name: Keep Alive
        shell: powershell
        run: |
          # Menjaga VM tetap berjalan hingga 6 jam
          Start-Sleep -Seconds 21600
          
